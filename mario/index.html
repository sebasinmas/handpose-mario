<!DOCTYPE html>
<html>
<head>
  <title>NES + Teachable Machine</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #141414;
      color: #f5f5f5;
    }

    #container {
      display: flex;
      align-items: flex-start;
      gap: 20px;
    }

    #screen {
      width: 576px;
      height: 540px;
      border: 2px solid #000;
      image-rendering: pixelated;
      background: #000;
    }

    #sidePanel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 260px;
    }

    .panel {
      background: #1f1f1f;
      border: 1px solid #333;
      padding: 10px 12px;
    }

    .panel h3 {
      margin: 0 0 8px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9ad1ff;
    }

    #webcam-container canvas {
      width: 220px !important;
      height: 220px !important;
      border: 2px solid #333;
      display: block;
    }

    #predictions {
      font-family: monospace;
      background: #000;
      color: #8cff98;
      min-height: 150px;
      line-height: 1.5;
    }

    #predictions .unsupported {
      color: #ff9696;
    }

    #model-status[data-state="warning"] {
      color: #ffd166;
    }

    #model-status[data-state="ok"] {
      color: #8cff98;
    }
  </style>
</head>
<body>

  <div id="container">

    <canvas
      id="screen"
      width="256"
      height="240">
    </canvas>

    <div id="sidePanel">
      <div class="panel">
        <h3>Camara</h3>
        <div id="webcam-container"></div>
      </div>

      <div class="panel">
        <h3>Estado</h3>
        <div id="debug-mode"></div>
        <div id="model-status" data-state="warning">Cargando modelo...</div>
        <div id="gesture-status">Clase detectada: --</div>
        <div id="effective-action">Accion efectiva: nothing | Estado: Sin accion</div>
      </div>

      <div class="panel">
        <h3>Predicciones</h3>
        <div id="predictions"></div>
      </div>

    </div>

  </div>

  <script src="https://unpkg.com/jsnes/dist/jsnes.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script src="main.js?v=2"></script>
</body>
</html>
